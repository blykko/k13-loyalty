<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>K13 Loyalty — Classement</title>
  <link rel="icon" href="/img/k13-logo.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@700;800&display=swap">
  <link rel="stylesheet" href="/css/app.css"/>
  <script>try{var d=localStorage.getItem('k13-dark');if(d==='1'||(d===null&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){}</script>
  <style>
    .lb-wrap{max-width:720px;margin:0 auto;padding:24px 16px 40px}
    .lb-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
    .lb-header{display:flex;align-items:center;gap:14px;margin-bottom:22px}
    .lb-title{font-family:'Sora',sans-serif;font-size:24px;font-weight:800;line-height:1.2}
    .lb-sub{font-size:13px;color:var(--t2)}
    .podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end;margin-bottom:18px}
    .pod{background:var(--white);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 10px;text-align:center;box-shadow:var(--sh)}
    .pod.p1{padding-top:22px;border-color:#FCD34D}
    .pod .medal{font-size:26px}
    .pod .lb-avatar{margin:6px auto}
    .pod .lb-name{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .lb-row{background:var(--white);border:1px solid var(--border);border-radius:var(--r-lg);padding:11px 14px;display:flex;align-items:center;gap:12px;margin-bottom:8px;box-shadow:var(--sh)}
    .lb-row.me,.pod.me{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-l)}
    .lb-rank{font-family:'Sora',sans-serif;font-size:15px;font-weight:800;width:34px;text-align:center;color:var(--t3)}
    .lb-avatar{width:40px;height:40px;border-radius:50%;background:var(--blue-l);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--blue);overflow:hidden;position:relative;flex-shrink:0}
    .lb-avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .lb-info{flex:1;min-width:0}
    .lb-name{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .lb-meta{font-size:12px;color:var(--t2)}
    .lb-pts{font-family:'Sora',sans-serif;font-size:17px;font-weight:800;color:var(--blue);text-align:right}
    .lb-pts-lbl{font-size:11px;color:var(--t3);text-align:right}
    .empty{text-align:center;color:var(--t2);padding:40px;font-size:14px}
  </style>
</head>
<body>
<div class="lb-wrap">
  <div class="lb-top">
    <a href="/" class="btn-ghost sm">← Retour</a>
    <button class="icon-btn" id="btn-dark" aria-label="Mode sombre">🌙</button>
  </div>
  <div class="lb-header">
    <img src="/img/k13-logo.png" alt="K13" class="logo-img"/>
    <div>
      <div class="lb-title">Classement K13</div>
      <div class="lb-sub" id="lb-sub">Top 50 des membres par points gagnés</div>
    </div>
  </div>
  <div class="cat-tabs"><button class="cat-tab active" data-period="points">💰 Solde actuel</button><button class="cat-tab" data-period="month">📅 Ce mois</button><button class="cat-tab" data-period="all">♾️ Depuis toujours</button></div>
  <div id="podium" class="podium hidden"></div>
  <div id="lb-list"><div class="empty">Chargement…</div></div>
</div>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RANK = { bronze: '🥉 Bronze', silver: '🥈 Silver', gold: '🥇 Gold' };
const btn = document.getElementById('btn-dark');
const sync = () => btn.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
btn.onclick = () => { const d = document.documentElement.classList.toggle('dark'); try { localStorage.setItem('k13-dark', d ? '1' : '0'); } catch {} sync(); };
sync();

function avatar(u) {
  const letter = esc((u.discord_username || u.username || '?').charAt(0).toUpperCase());
  const img = u.discord_id && u.discord_avatar
    ? `<img src="https://cdn.discordapp.com/avatars/${esc(u.discord_id)}/${esc(u.discord_avatar)}.png?size=64" alt="" onerror="this.remove()"/>` : '';
  return `<div class="lb-avatar">${img}<span>${letter}</span></div>`;
}
const pts = n => Number(n || 0).toLocaleString('fr-FR');

document.querySelectorAll('[data-period]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-period]').forEach(x => x.classList.toggle('active', x === b));
  load(b.dataset.period);
});
load('points');

async function load(period) {
  let data;
  document.getElementById('podium').classList.add('hidden');
  document.getElementById('lb-sub').textContent = {
    points: 'Points actuellement sur le compte (jeux et achats compris)',
    month: 'Points gagnés ce mois (hors jeux) · remise à zéro le 1er du mois',
    all: 'Points gagnés depuis l\'inscription' }[period];
  try { data = await (await fetch('/api/user/leaderboard?period=' + period, { credentials: 'same-origin' })).json(); } catch { data = null; }
  const list = document.getElementById('lb-list');
  if (!data?.ok) { list.innerHTML = '<div class="empty">Impossible de charger le classement.</div>'; return; }
  if (!data.leaderboard.length) { list.innerHTML = '<div class="empty">Aucun membre classé pour l\'instant.</div>'; return; }
  const lb = data.leaderboard, me = data.me;

  if (lb.length >= 3) {
    const pod = document.getElementById('podium');
    pod.innerHTML = [1, 0, 2].map(i => { const u = lb[i]; return `<div class="pod p${i + 1} ${u.id === me ? 'me' : ''}">
      <div class="medal">${['🥇','🥈','🥉'][i]}</div>${avatar(u)}
      <div class="lb-name">${esc(u.discord_username || u.username)}</div>
      <div class="lb-pts" style="text-align:center">${pts(u.points)}</div></div>`; }).join('');
    pod.classList.remove('hidden');
  }
  list.innerHTML = lb.map((u, i) => (lb.length >= 3 && i < 3) ? '' : `<div class="lb-row ${u.id === me ? 'me' : ''}">
    <div class="lb-rank">${i < 3 ? ['🥇','🥈','🥉'][i] : '#' + (i + 1)}</div>
    ${avatar(u)}
    <div class="lb-info">
      <div class="lb-name">${esc(u.discord_username || u.username)}${u.id === me ? ' (toi)' : ''}</div>
      <div class="lb-meta">${RANK[u.rank] || ''}${u.streak ? ` · 🔥 ${u.streak}` : ''}</div>
    </div>
    <div><div class="lb-pts">${pts(u.points)}</div><div class="lb-pts-lbl">points</div></div>
  </div>`).join('');
}
</script>
</body>
</html>
