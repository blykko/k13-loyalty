name: Deploy K13 Loyalty

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/k13-loyalty

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            # Dossier du projet sur le VPS (modifiable via la variable de dépôt APP_DIR)
            cd "${{ vars.APP_DIR || '/home/ubuntu/k13-loyalty/k13-loyalty' }}"
            # Si le dossier est un clone git : récupère le code (cas d'un compose en "build: .")
            # Git est lancé avec le propriétaire du dossier (ex. ubuntu) même si la connexion SSH
            # se fait en root : sinon "dubious ownership" et fichiers créés en root.
            if [ -d .git ]; then
              OWNER=$(stat -c %U .)
              if [ "$(id -un)" != "$OWNER" ] && command -v sudo >/dev/null; then sudo -u "$OWNER" git pull --ff-only
              else git -c safe.directory='*' pull --ff-only; fi
              echo "Code déployé : $(git -c safe.directory='*' log --oneline -1)"
            fi
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull k13-loyalty || true
            docker compose up -d --build --no-deps k13-loyalty
            # Redémarrage automatique si le conteneur s'arrête (crash, reboot du VPS)
            docker update --restart unless-stopped $(docker compose ps -q k13-loyalty) || true
            docker image prune -f